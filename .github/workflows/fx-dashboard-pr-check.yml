name: FX website chart UI regression check
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - '.github/workflows/fx-dashboard-pr-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Validate embedded chart JavaScript parses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('docs/index.html').read_text()
          script=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/fx-inline.js').write_text(script)
          assert 'Object.keys(feed.pairs).filter(k=>feed.pairs[k].deep)' not in script
          for name in ('ichimoku','supertrend','donchian','bollinger','stochastic'):
              assert name in script, f'missing indicator {name}'
          PY
          node --check /tmp/fx-inline.js
