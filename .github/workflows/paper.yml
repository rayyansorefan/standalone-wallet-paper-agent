name: Standalone wallet PAPER research
on:
  workflow_dispatch:
    inputs:
      scheduler:
        description: External scheduler identifier
        required: false
        default: manual
        type: string
      scheduled_at:
        description: External scheduler UTC timestamp
        required: false
        type: string
      trigger_uid:
        description: External scheduler trigger identifier
        required: false
        type: string
  schedule:
    - cron: '1-56/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: standalone-wallet-paper-research
  cancel-in-progress: false
jobs:
  paper:
    outputs:
      executed: ${{ steps.scan.outputs.executed }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only paper research
        id: scan
        env:
          PAPER_SCHEDULER: ${{ github.event_name == 'schedule' && 'github-cron' || inputs.scheduler }}
          PAPER_SCHEDULED_AT: ${{ inputs.scheduled_at }}
          PAPER_TRIGGER_UID: ${{ inputs.trigger_uid }}
        run: python -m agent.scheduled
      - name: Save cycle state and updated visualiser feed
        if: always() && steps.scan.outputs.executed == 'true'
        run: |
          if [ -f state/state.json ] && [ -f docs/state.json ]; then
            git config user.name 'standalone-wallet-paper[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f state/state.json docs/state.json
            if ! git diff --cached --quiet; then
              git commit -m "paper research $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase
              git push
            fi
          else
            echo 'No completed paper observation state to publish.'
          fi
      - name: Fail visibly if key market feeds were unavailable
        if: always() && steps.scan.outputs.executed == 'true'
        run: |
          if [ -f state/state.json ]; then
            python - <<'PYCODE'
          import json,sys
          s=json.load(open('state/state.json'))
          status=s.get('last_status')
          print('Latest research status:', status)
          print('Wallet candidates:',len(s.get('observed',{})))
          health=s.get('cycle_health') or {}
          print('Latest cycle screening:',health)
          if status == 'PARTIAL_SCREENING_UNAVAILABLE':
              print('::warning::Partial safety provider failure: affected tokens were blocked; '
                    'other safe-token trade feeds succeeded. Check cycle_health, screening and audit log.')
          if status == 'PARTIAL_TRADE_FEEDS_UNAVAILABLE':
              print('::warning::Partial market trade-feed failure: missing pools were not traded; '
                    'other safe-token feeds succeeded. Check cycle_health and audit log.')
          w=(s.get('research') or {}).get('whale_v3') or {}
          print('Whale research status:',w.get('status'),'metrics:',w.get('scan_metrics'))
          if w.get('status') != 'OK':
              print('::warning::Whale research incomplete; inspect persisted V3 errors and provider cooldowns.')
          e=(s.get('research') or {}).get('evaluation_v1') or {}
          print('Forward evaluation:',e.get('status'),'validated cohorts:',e.get('validated_reports',0))
          if status not in ('OK','BOOTSTRAPPED_NO_TRADES','NO_SAFE_POOLS','NO_ELIGIBLE_POOLS',
                          'PARTIAL_SCREENING_UNAVAILABLE','PARTIAL_TRADE_FEEDS_UNAVAILABLE'):
              print('WARNING: Research cycle was incomplete or degraded. Inspect audit data.')
              sys.exit(2)
          PYCODE
          else
            echo 'FAIL: state/state.json not generated'
            exit 2
          fi

  dashboard:
    needs: paper
    if: always() && needs.paper.outputs.executed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish actual observation feed and dashboard
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Allow transient Pages API recovery
        if: steps.publish.outcome == 'failure'
        run: sleep 10
      - name: Retry transient Pages publication once
        if: steps.publish.outcome == 'failure'
        uses: actions/deploy-pages@v4
