# One-time, presence-only diagnostic for GitHub Actions Helius secret scope.
# Does not print/read key contents, call an API, or alter paper trading state.
# Runs only when this file first lands on main (or is edited again).
name: Diagnose Helius Actions secret scope
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/helius-secret-scope-diagnostic.yml'
permissions:
  contents: read
jobs:
  paper-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check availability to ordinary PAPER job (presence only)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        shell: bash
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            echo '::notice title=Helius secret scope::ORDINARY_JOB_PRESENT'
          else
            echo '::warning title=Helius secret scope::ORDINARY_JOB_ABSENT'
          fi
  pages-environment-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment:
      name: github-pages
    steps:
      - name: Check availability to existing Pages environment (presence only)
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        shell: bash
        run: |
          if [ -n "$HELIUS_API_KEY" ]; then
            echo '::notice title=Helius secret scope::PAGES_JOB_PRESENT'
          else
            echo '::warning title=Helius secret scope::PAGES_JOB_ABSENT'
          fi
