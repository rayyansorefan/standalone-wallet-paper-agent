name: Verify paper trading code changes
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'tests/**'
      - 'infra/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'tests/**'
      - 'infra/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Google scheduler tests
        run: node infra/google_apps_script/test.mjs
