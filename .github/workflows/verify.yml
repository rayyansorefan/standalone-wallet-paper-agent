name: Verify paper trading code changes
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'docs/index.html'
      - 'docs/trade-history.js'
      - 'tests/**'
      - 'infra/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'docs/index.html'
      - 'docs/trade-history.js'
      - 'tests/**'
      - 'infra/**'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Google scheduler tests
        run: node infra/google_apps_script/test.mjs
      - name: Trade history dashboard regression tests
        run: |
          node --check docs/trade-history.js
          node --check docs/owner-visuals.js
          node --test tests/trade_history.test.cjs
      - name: Check dashboard JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, tempfile
          html=pathlib.Path('docs/index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script>',html,re.I|re.S)
          checked=0
          for body in scripts:
              if not body.strip(): continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',encoding='utf8') as f:
                  f.write(body);f.flush()
                  subprocess.run(['node','--check',f.name],check=True)
              checked+=1
          if checked<1:raise SystemExit('No embedded JavaScript scripts found')
          print(f'Checked {checked} embedded JavaScript blocks')
          PY
