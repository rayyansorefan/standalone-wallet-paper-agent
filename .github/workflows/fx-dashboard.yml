name: FX HTML dashboard deployment
on:
  push:
    branches: [main]
    paths: ['docs/**','tests/**','.github/workflows/fx-dashboard.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fx-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Verify chart rendering inputs, source freshness gate and JS syntax
        run: node --test tests/fx_dashboard_smoke.test.mjs
      - name: Exercise FX charts, technical panels, trade journal and stale-price guards
        run: node tests/dashboard-smoke.mjs
      - name: Validate public feed
        run: |
          python - <<'PY'
          import json
          d=json.load(open('docs/fx-feed.json'))
          from pathlib import Path
          size = len(Path('docs/fx-feed.json').read_bytes())
          assert size < 950_000, f'Public feed exceeds 950 KB: {size} bytes'
          allowed = {'schema','snapshot_at','news_at','published_at','status',
                     'news_status','coverage','priorities','pairs','signals',
                     'research_setups','hourly','sources','headlines','calendar','learning'}
          assert set(d) <= allowed, f'Unknown public fields: {set(d)-allowed}'
          assert d['schema']==1 and d['snapshot_at'] and d['pairs']
          assert isinstance(d['signals'],list)
          assert isinstance(d['research_setups'],list)
          assert "GBP_ZAR" not in json.dumps(d), "Excluded GBP/ZAR still present in public feed"
          assert all(s.get('approved_entry') is False and
                     s.get('status') == 'CONDITIONAL_RESEARCH_NOT_TRIGGERED'
                     for s in d['research_setups'])
          print('Validated FX feed')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed public FX feed (not merely successful build)
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request
          with open("docs/fx-feed.json", encoding="utf-8") as source:
              expected = json.load(source)
          base = os.environ["PAGE_URL"].rstrip("/") + "/"
          url = urllib.parse.urljoin(base, "fx-feed.json")
          url += "?verify=" + os.environ["GITHUB_RUN_ID"]
          last_error = "public URL did not match"
          for attempt in range(12):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      live = json.load(response)
                  if "GBP_ZAR" in json.dumps(live):
                      last_error = "Live GitHub Pages feed still contains excluded GBP/ZAR"
                      print(f"Pages readback {attempt+1}/12: {last_error}", flush=True)
                      time.sleep(6)
                      continue
                  if (live.get("snapshot_at") == expected.get("snapshot_at")
                          and live.get("published_at") == expected.get("published_at")):
                      print("Verified public FX feed:", live["snapshot_at"], url)
                      sys.exit(0)
                  last_error = ("Stale site: live snapshot "
                                + str(live.get("snapshot_at")) + ", expected "
                                + str(expected.get("snapshot_at")))
              except Exception as exc:
                  last_error = type(exc).__name__ + ": " + str(exc)[:200]
              print(f"Pages readback {attempt+1}/12: {last_error}", flush=True)
              time.sleep(6)
          sys.exit("ERROR: GitHub Pages is not serving the deployed FX feed: " + last_error)
          PY
