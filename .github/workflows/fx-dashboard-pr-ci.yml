name: FX dashboard pull request safety checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/ui-version.json'
      - 'tests/**'
      - '.github/workflows/fx-dashboard-pr-ci.yml'
permissions:
  contents: read
jobs:
  public-ui-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard syntax and feed integrity
        run: node --test tests/fx_dashboard_smoke.test.mjs
      - name: Exercise rendered ranking, conditional-entry and outage guards
        run: node tests/dashboard-smoke.mjs
